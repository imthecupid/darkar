<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a2d22" />
    <title>HomeHarbor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app" class="AppShell">
      <header class="TopBar">
        <a class="Brand" href="#/">
          <span class="BrandMark" aria-hidden="true"></span>
          <span class="BrandText">HomeHarbor</span>
        </a>
        <div class="TopActions">
          <button class="IconButton" id="globalSearchBtn" type="button" aria-label="Search">
            <span aria-hidden="true">⌕</span>
          </button>
          <button class="IconButton" id="accountBtn" type="button" aria-label="Account">
            <span aria-hidden="true">⟡</span>
          </button>
        </div>
      </header>

      <main id="main" class="Main" role="main"></main>

      <nav class="BottomNav" aria-label="Primary">
        <a class="NavItem" href="#/" data-nav="explore">
          <span class="NavIcon" aria-hidden="true">⌂</span>
          <span class="NavLabel">Explore</span>
        </a>
        <a class="NavItem" href="#/search" data-nav="search">
          <span class="NavIcon" aria-hidden="true">⌕</span>
          <span class="NavLabel">Search</span>
        </a>
        <a class="NavItem NavPrimary" href="#/sell/new" data-nav="sell">
          <span class="NavIcon" aria-hidden="true">＋</span>
          <span class="NavLabel">Sell</span>
        </a>
        <a class="NavItem" href="#/favorites" data-nav="favorites">
          <span class="NavIcon" aria-hidden="true">⟡</span>
          <span class="NavLabel">Saved</span>
        </a>
        <a class="NavItem" href="#/inquiries" data-nav="inquiries">
          <span class="NavIcon" aria-hidden="true">✦</span>
          <span class="NavLabel">Inquiries</span>
        </a>
      </nav>
    </div>

    <div id="modalRoot" class="ModalRoot" aria-hidden="true"></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
