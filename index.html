<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a2d22" />
    <title>HomeHarbor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app" class="AppShell">
      <header class="TopBar">
        <a class="Brand" href="#/">
          <img class="BrandLogo" src="./assets/logo.png" alt="HomeHarbor" />
        </a>
        <div class="TopActions">
          <button class="LangButton" id="langBtn" type="button" aria-label="Language">
            EN
          </button>
        </div>
      </header>

      <main id="main" class="Main" role="main"></main>

      <nav class="BottomNav" aria-label="Primary">
        <a class="NavItem" href="#/" data-nav="explore">
          <span class="NavIcon" aria-hidden="true"
            ><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1v-8.5z" /></svg
          ></span>
          <span class="NavLabel">Explore</span>
        </a>
        <a class="NavItem" href="#/inquiries" data-nav="inquiries">
          <span class="NavIcon" aria-hidden="true"
            ><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M7.5 18.5 4 20V6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v8A2.5 2.5 0 0 1 17.5 17h-7.6l-2.4 1.5z"
              /></svg
          ></span>
          <span class="NavLabel">Messages</span>
        </a>
        <a class="NavItem NavPrimary" href="#/sell/new" data-nav="sell">
          <span class="NavIcon" aria-hidden="true">＋</span>
          <span class="NavLabel">Sell</span>
        </a>
        <a class="NavItem" href="#/favorites" data-nav="favorites">
          <span class="NavIcon" aria-hidden="true"
            ><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M7 4h10a1 1 0 0 1 1 1v16l-6-3-6 3V5a1 1 0 0 1 1-1z" /></svg
          ></span>
          <span class="NavLabel">Saved</span>
        </a>
        <a class="NavItem" href="#/account" data-nav="account" id="accountNav">
          <span class="NavIcon" aria-hidden="true">👤</span>
          <span class="NavLabel">Account</span>
        </a>
      </nav>
    </div>

    <div id="modalRoot" class="ModalRoot" aria-hidden="true"></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
